service: service-a
strict: true

# 情境參數：這個 service 的 config 有欄位會依廠別不同而有不同的合法值
context_params:
  - name: factory
    description: "廠別，決定 api_url 應指向哪個廠區的網址"
    required: true
    enum: [A, B]

rules:

  env:
    required: true
    type: string
    description: "部署環境"
    enum: [dev, staging, production]

  mode:
    required: true
    type: string
    description: "廠區運作模式，active=正式服務中，standby=備援待命"
    enum: [active, standby]

  log_level:
    required: false
    type: string
    description: "日誌輸出等級"
    enum: [debug, info, warn, error]

  port:
    required: true
    type: integer
    description: "服務對外監聽的 port"
    min: 1024
    max: 65535

  timeout_ms:
    required: true
    type: integer
    description: "對外請求逾時毫秒數"
    min: 100
    max: 60000

  replicas:
    required: false
    type: integer
    description: "副本數量"
    min: 1
    max: 20

  service_name:
    required: true
    type: string
    description: "服務識別名稱，會被用於組成內部監控儀表板網址（拼接使用）"
    pattern: '^[a-z][a-z0-9-]*$'
    used_in_concat: true

  api_url:
    required: true
    type: string
    description: "外部 API 位址，會被其他系統以字串拼接方式接續使用，且依廠別不同指向不同網址"
    used_in_concat: true
    context_patterns:
      factory:
        A: '^https://api-a\.factory\.example\.com/v1$'
        B: '^https://api-b\.factory\.example\.com/v1$'

  admin_email:
    required: false
    type: string
    description: "異常通知信箱"
    format: email

  database.host:
    required: true
    type: string
    description: "資料庫主機位址"
    format: hostname

  database.port:
    required: true
    type: integer
    description: "資料庫連線 port"
    min: 1
    max: 65535

  allowed_ips:
    type: list
    description: "白名單 IP 清單"
    item_pattern: '^(\d{1,3}\.){3}\d{1,3}$'

  servers.[].port:
    required: true
    type: integer
    description: "叢集內每台伺服器的服務 port"
    min: 1
    max: 65535

  servers.[].role:
    required: true
    type: string
    description: "叢集內伺服器角色"
    enum: [primary, replica]